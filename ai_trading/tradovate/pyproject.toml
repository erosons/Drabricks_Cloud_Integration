[project]
name = "tradovate-futures-bot"
version = "0.1.0"
description = "CME mini/micro futures bot on the Tradovate API (see docs/README.md)"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
