# ============================================================================
# Tradovate Futures Bot — Global Configuration
# ============================================================================

# ----------------------------------------------------------------------------
# Execution mode — the three-switch safety model
#
#   dry_run: true                        → signals only, NO orders anywhere
#   dry_run: false + live_trading: false → orders to Tradovate DEMO account
#   dry_run: false + live_trading: true  → orders to Tradovate LIVE account
#
# Which products trade is controlled per-product in products.yaml (trade: true).
# The launcher spawns one process per product with trade: true.
# ----------------------------------------------------------------------------
mode:
  dry_run: true
  live_trading: false

# ----------------------------------------------------------------------------
# Tradovate API endpoints (selected automatically from mode)
# ----------------------------------------------------------------------------
tradovate:
  demo_rest: https://demo.tradovateapi.com/v1
  live_rest: https://live.tradovateapi.com/v1
  market_data_ws: wss://md.tradovateapi.com/v1/websocket
  demo_ws: wss://demo.tradovateapi.com/v1/websocket
  live_ws: wss://live.tradovateapi.com/v1/websocket
  token_renewal_minutes: 60          # access tokens expire ~90 min; renew early
  # Credentials come from environment / .env — never from this file:
  #   TRADOVATE_USERNAME, TRADOVATE_PASSWORD, TRADOVATE_APP_ID,
  #   TRADOVATE_CID, TRADOVATE_SECRET, TRADOVATE_DEVICE_ID
  # NOTE: market_data_ws is dead for retail keys — md/subscribe* needs a CME
  # ILA sub-vendor license (support, 2026-08-19). Live MD comes from the
  # databento block below; Tradovate handles orders + fills only.

# Live market data (docs/API-document.md). Key from environment / .env:
#   DATABENTO_API_KEY  — needs an active CME (Standard) subscription.
# Standard live is L1-only: trades + mbp-1, top-of-book book.
databento:
  dataset: GLBX.MDP3

# ----------------------------------------------------------------------------
# Trading session (America/New_York)
#
# Day session: opens 08:00 ET, closes 16:00 ET the same day.
# At (close − flatten_buffer_minutes) the bot flattens every position and
# cancels every working order. Outside the window no orders are placed.
# ----------------------------------------------------------------------------
session:
  timezone: America/New_York
  open: "08:00"                      # 8:00 AM ET
  close: "16:00"                     # 4:00 PM ET (next day)
  flatten_buffer_minutes: 5          # start flatten/cancel at 15:55 ET
  trade_days: [Sun, Mon, Tue, Wed, Thu, Fri]   # Globex week (Sun open → Fri close)

# ----------------------------------------------------------------------------
# Economic news guard (ForexFactory)
#
# Daily scrape of https://www.forexfactory.com/calendar filtered to
# currency=USD, impact=High ("red folder"). Each matching event creates a
# blackout window [event − before, event + after]:
#   - no NEW entries during a blackout
#   - working entry orders are cancelled at blackout start
#   - open positions: behavior set by position_policy
# ----------------------------------------------------------------------------
news_guard:
  enabled: true
  source_url: https://www.forexfactory.com/calendar
  currencies: [USD]
  impacts: [high]                    # red folder only
  blackout_before_minutes: 15
  blackout_after_minutes: 15
  refresh_time_et: "18:00"           # re-scrape calendar daily before the open
  position_policy: hold              # hold | flatten  (what to do with an open
                                     # position when a blackout begins)

# ----------------------------------------------------------------------------
# Active-contract resolver (CME Volume & Open Interest)
#
# Once per day the resolver pulls Volume & OI for every product with
# trade: true (e.g. https://www.cmegroup.com/markets/agriculture/grains/corn/volume)
# and stores the contract month with the highest volume AND open interest as
# the ACTIVE contract (e.g. MES → MESU6). A roll is flagged when the winner
# changes; the bot finishes the session on the old month, then subscribes to
# the new one at the next session open.
# ----------------------------------------------------------------------------
contract_resolver:
  refresh_time_et: "18:30"           # after CME publishes prior-day final volume
  selection_rule: max_volume_and_oi  # both must agree; else prefer max volume
  stale_after_hours: 48              # refuse to trade if data older than this
  volume_url_template: "https://www.cmegroup.com/markets/{cme_slug}/volume"

# ----------------------------------------------------------------------------
# Storage
# ----------------------------------------------------------------------------
database:
  path: data/tradovate_bot.db        # SQLite
  tables: [active_contracts, volume_oi_history, news_events, fills, equity_snapshots]

# ============================================================================
# STRATEGIES — from docs/trading-strategies-SKILL.md (the playbook)
#
# Architecture follows the playbook's Skill 22 consolidation note: five shared
# services + thin signal modules. Each strategy lists its skill number(s),
# tier (scalp = 1–5 min, swing = 30 min+), build priority, and an `enabled`
# flag. A strategy trades only when `enabled: true` AND its regime gate allows
# it AND the product/session/news gates pass.
#
# Priority tiers (playbook Skill 20 note):
#   1 = build first (mechanical, complete, futures-native)
#   2 = build second (mechanical, needs parameter lock)
#   3 = provisional (rules ambiguous/incomplete — resolve before building)
#   x = excluded from automation (Gann 14, Renko 18, Elliott 20;
#       martingale sizing of Skill 5 discarded — signal folded into ema_snapback)
# ============================================================================

# ----------------------------------------------------------------------------
# Shared services (consumed by all strategy modules)
# ----------------------------------------------------------------------------
shared_services:

  structure_engine:                  # pivots, HH/HL state, BOS (skills 1,15,19,21,22)
    pivot_left: 5
    pivot_right: 5                   # pivot confirms pivot_right bars late — never
                                     # fill earlier than the confirmation bar
    bos_buffer_atr: 0.25             # close beyond level by >= 0.25 x ATR(14)

  levels_service:                    # one level engine, many providers
    session_anchor: rth              # rth | eth — decide once; identical in
                                     # backtest and live (skills 8,13,16,23)
    providers:
      pivots_traditional: true       # P/R1/R2/S1/S2 from prior session (skill 13)
      cpr: true                      # Pivot/TC/BC + width percentile (skills 23,24)
      vwap_bands: true               # session VWAP hlc3, ±1/2/3σ (skills 8,16)
      session_extremes: true         # prior-day H/L, overnight H/L (skills 4,21)
      volume_zones: false            # base→impulse supply/demand (skills 15,21);
                                     # prefer volume-profile nodes when built
    zone_tolerance_atr: 0.25
    zone_max_touches: 2              # zone expires after this many tests

  regime_classifier:                 # routes trend vs range modules (skills 3,11,23,24)
    ema_fast: 9
    ema_slow: 21
    min_ema_separation_atr: 0.25     # below this = chop, trend modules off
    adx_period: 14
    adx_trend_threshold: 20
    vwap_slope_flat_threshold: 0.05  # |slope| below = rotational day (skill 16 gate)
    cpr_width_lookback_sessions: 60
    cpr_narrow_percentile: 30        # ≤ → expect trend day → breakout modules
    cpr_wide_percentile: 70          # ≥ → expect rotation → fade/reaction modules
    vwap_warmup_minutes: 30          # no VWAP-based signals until bands mature

  strategy_router:                   # picks THE ONE live module per product
    # max_concurrent_strategies_per_product = 1 (risk_operations) says only one
    # module may be live on a product; THIS block says WHICH one when several
    # qualify — two different rules, and the tie-breaker is explicit so it never
    # resolves by accident. Selection happens at regime evaluation, BEFORE
    # entries are considered: only the selected module may even look for a
    # signal, so "two strategies want to enter at the same instant" cannot
    # arise by construction.
    selection_order:                 # applied top-to-bottom; each rule narrows
      - eligibility                  # enabled: true + lifecycle_state live (or
                                     #   incubation → paper) + gates F1–F4 pass
      - regime_specificity           # module whose declared regime gate most
                                     #   tightly matches the classifier state
                                     #   (trend/range, CPR width, VWAP slope)
      - priority                     # playbook build tier: 1 beats 2 beats 3
      - config_order                 # final deterministic tie-break: first
                                     #   declared under strategies: wins
    reevaluate: regime_change_or_session_open
    handoff: flat_only               # an open position is managed to completion
                                     # by the module that opened it; the router
                                     # switches modules only when the product is
                                     # flat — never mid-position

  trailing_exit_engine:              # ONE trail engine, pluggable providers.
    # EXACTLY ONE provider may have enabled: true — that is the engine default.
    # Startup validation fails on zero or on two+ enabled (same rule as the
    # per-product risk block: no silent fallbacks). A strategy may still name
    # its own provider (trail_provider / exit in its params); that override
    # applies only while that strategy is the live module on the product, and
    # since max_concurrent_strategies_per_product = 1, each product always has
    # exactly one trail provider in use at any moment.
    providers:
      quadrant:
        enabled: true                # DEFAULT — tick-native milestone trail
                                     # (README §13); geometry derived per product
                                     # from the risk block (risk_reward_ratio ×
                                     # trail_step_pct), no params of its own
      supertrend:
        enabled: false               # skill 12
        atr_period: 10
        multiplier: 3.0
      sma:
        enabled: false               # skill 10
        period: 20
      donchian:
        enabled: false               # skill 17
        period: 20
      fractal:
        enabled: false               # skill 19
        left: 2
        right: 2
      sar:
        enabled: false               # skill 31 (weakest — A/B only)
        start: 0.02
        step: 0.02
        max: 0.2

  execution_guards:                  # apply to every module
    slippage_model_ticks: { ES: 2, NQ: 4, default: 2 }
    min_reward_to_cost_multiple: 2.0 # skip if expected move < 2x round-trip cost
    max_trade_risk_usd: 50.0         # skip signals whose structural stop exceeds this
    order_cooldown_seconds: 10

# ----------------------------------------------------------------------------
# Strategy modules
# ----------------------------------------------------------------------------
strategies:

  # --- Base engine carried over from the kraken bot (order-flow scalp) ------
  order_flow_scalp:
    skill: legacy-kraken
    tier: scalp
    priority: 1
    enabled: true
    params:
      # Databento Standard live feed is L1-only (no MBP-10/MBO), so the live
      # book has exactly one level. Depth-10 imbalance is a backtest-only
      # question (the pulled MBP-10 month) until the Plus tier is justified.
      book_depth: 1
      imbalance_threshold: 0.25
      min_confidence: 0.55
      max_spread_ticks: 2
      fast_ema: 20
      slow_ema: 60
      spike_threshold: 0.003
      recovery_pct: 0.5
      exhaustion_ttl: 60
      retest_proximity: 0.002
      retest_memory_ticks: 400
      retest_ttl: 40

  # --- Data-derived (2026-08 research campaign) -----------------------------
  opening_range:
    skill: data-derived
    tier: swing
    priority: 1
    enabled: false                 # factory-eligible only; lifecycle decides
    params:
      or_window_minutes: 30        # range = first N minutes of RTH
      buffer_atr: 0.10             # close must clear boundary by this x ATR
      stop_mode: mid               # mid | opposite
      target_rr: 2.0
      entry_cutoff_min: 120        # no entries later than N min after open
      min_range_atr: 1.0           # quality filter (fixed, not gridded)
      max_range_atr: 6.0
      # news rule (card): entries never before 08:45 ET regardless of window

  momentum_dollar_trail:
    skill: user-specified
    tier: scalp
    priority: 1
    enabled: false
    params:
      move_trigger_ticks: 2        # 2 consecutive same-direction closes ≥ this
      trail_dollars: 10.00         # PRICE dollars trailed from the extreme
      max_loss_usd: 40.00          # hard initial stop in P&L dollars/contract

  # --- Priority 1: build first ---------------------------------------------
  pivot_levels:
    skill: [13, 26]
    tier: swing
    priority: 1
    enabled: false
    params:
      entry_mode: retest             # breakout (skill 13) | retest (skill 26) —
                                     # run both in backtest, pick per instrument
      retest_window_bars: 12
      targets: [R1, R2]              # structural two-target ladder
      bias_buffer_atr: 0.25          # close beyond P by this before bias flips

  cpr_day_router:
    skill: [23, 24]
    tier: swing
    priority: 1
    enabled: false
    params:                          # narrow day → breakout child; wide day →
      narrow_mode: breakout          #   band-reaction child; mutually exclusive
      wide_mode: band_reaction       #   per session by CPR width percentile
      # PREREQUISITE (playbook): validate "CPR width predicts day type" on
      # ES/NQ history before trusting either child.

  bb_squeeze_breakout:
    skill: 10
    tier: swing                      # 30-minute per card
    priority: 1
    enabled: false
    params:
      bb_period: 20
      bb_stdev: 2.0
      bbw_squeeze_percentile: 20     # BBW below this pctile of last 150 bars
      bbw_lookback_bars: 150
      require_bbw_break: true        # BOTH legs mandatory — do not weaken
      trail_provider: sma20

  vwap_rsi_pullback:
    skill: 8
    tier: scalp
    priority: 1
    enabled: false
    params:
      rsi_period: 14
      rsi_arm_below: 30              # arms setup; VWAP hold triggers it
      rsi_arm_ttl_bars: 10
      rsi_exit_above: 70
      fallback_target: vwap_band_1   # RSI exit alone is weak — band target backup
      direction_filter: vwap_side    # longs only above VWAP (mirror shorts)

  supertrend_rsi:
    skill: 12
    tier: swing
    priority: 1
    enabled: false
    params:
      supertrend: { atr_period: 10, multiplier: 3.0 }
      rsi_period: 14
      rsi_confirm_long: 60           # confirm threshold from card text when captured
      rsi_confirm_short: 40
      exit: supertrend_flip          # stop and trail are the Supertrend line

  ema_snapback_scalp:
    skill: [6, 5]                    # skill 5's signal folded in; martingale DISCARDED
    tier: scalp
    priority: 1
    enabled: false
    params:
      timeframe_minutes: 5
      ema_period: 7
      detachment_min_atr: 0.5        # ignore marginal 1-tick detachments
      stop: swing_low
      target: ema_line               # dynamic — modify exit each bar
      time_stop_bars: 12             # exit if EMA never reached (trend-day guard)
      sizing: flat                   # NEVER martingale (playbook skill 5 verdict)

  ema_sr_break:
    skill: 3
    tier: scalp
    priority: 1
    enabled: false
    params:
      ema_fast: 9
      ema_slow: 21
      level_source: session_extremes # session levels beat rolling N-bar extremes
      break_confirmation: close      # close-based, never wick-based
      trail_alt: ema21_close_back    # or 1:2/1:4 ladder

  # --- Priority 2: build second (parameters locked here for reproducibility) -
  two_legged_pullback:
    skill: 1
    tier: swing
    priority: 2
    enabled: false
    params:
      entry: signal_candle_high_stop
      stop: signal_candle_low
      targets: { t1_rr: 2.0, t1_fraction: 0.5, t2_rr: 4.0 }
      breakeven_after_t1: true
      min_contracts_for_partials: 2  # 1 contract → T2-only
      max_signal_risk_usd: 50.0      # skip wide signal candles (NQ hazard)

  volume_breakout:
    skill: 2
    tier: swing
    priority: 2
    enabled: false
    params:
      consolidation_bars: [8, 20]
      consolidation_max_range_atr: 1.0
      low_volume_ratio: 0.7          # vs 20-bar RVOL same-time-of-day baseline
      breakout_body_atr: 1.5
      breakout_volume_ratio: 1.5
      volume_baseline: rvol_time_of_day   # NOT flat SMA — intraday U-shape
      roll_week_guard: true          # volume migrates during contract roll

  micro_flag_scalp:
    skill: 7
    tier: scalp
    priority: 2
    enabled: false
    params:
      timeframe_minutes: 1
      cluster_bars: [3, 6]           # "4 small candles" relaxed per playbook
      candle_max_atr: 0.6
      trend_filter: ema9_21_or_vwap_side
      session_window_hours_after_open: 3
      execution: python_ws_only      # latency-critical; no webhook path

  vwap_band_fade:
    skill: 16
    tier: scalp
    priority: 2
    enabled: false
    params:
      entry_band_sigma: 2            # test 2 vs 3 (card ambiguous)
      confirmation: close_back_inside
      targets: { t1: vwap, t2: opposite_band }
      regime_gate: vwap_flat_only    # MANDATORY — never fade band rides on trend days
      mutually_exclusive_with: vwap_rsi_pullback   # opposite uses of same indicator

  donchian_pullback:
    skill: 17
    tier: swing
    priority: 2
    enabled: false
    params:
      period: 20                     # test 10/20/55 (Turtle set) out-of-sample
      pullback_target: mid_line
      pullback_tolerance_channel_width: 0.25
      stop: pullback_swing_low
      exit: close_below_mid
      near_substitute_of: supertrend_rsi   # run one per instrument, not both

  fractal_trend:
    skill: 19
    tier: swing
    priority: 2
    enabled: false
    params:
      sma_filter: 50
      sma_buffer_atr: 0.25
      entry: confirmed_up_fractal_break    # fractal known only at N+2 — no lookahead
      stop: last_confirmed_down_fractal
      trail_provider: fractal

  zone_sweep:
    skill: [15, 21]                  # supply/demand zones + SMC sweeps = ONE module
    tier: swing
    priority: 2
    enabled: false
    params:
      zone_source: volume_zones      # or volume-profile nodes when available
      impulse_min_atr: 2.0
      zone_volume_ratio: 1.5
      sweep_max_penetration_ticks: 8
      sweep_reclaim_bars: 3
      stop_buffer_ticks: 3           # futures sweep the obvious wick by a few ticks
      min_rr: 1.5

  structure_break:
    skill: 22
    tier: swing
    priority: 2
    enabled: false
    params:
      entry: close_beyond_prior_swing
      buffer_atr: 0.25               # obvious swing points get swept — buffer mandatory
      stop: last_higher_low
      targets: { t1_rr: 2.0, t2_rr: 4.0 }
      compare_against: two_legged_pullback   # same structure engine, different timing

  pinbar_zone_fade:
    skill: 4
    tier: swing                      # 15-min+ only; pinbars are noise on 1-min
    priority: 2
    enabled: false
    params:
      min_timeframe_minutes: 15
      wick_body_ratio: 2.0
      zone_source: session_extremes
      stop_buffer_ticks: 3
      regime_gate: range_only        # MANDATORY — no pinbar fades against EMA trend
      target: opposite_zone
      min_range_to_risk: 2.0

  vcp_breakout:
    skill: 29
    tier: swing                      # daily/4H; long-side pattern
    priority: 2
    enabled: false
    params:
      min_contractions: 2
      contraction_ratio: 0.7         # each pullback ≤ 0.7 x previous
      volume_dry_up_filter: true
      stop: last_contraction_low
      long_only: true
      # Equity-native pattern — validate on futures data before trusting.

  # --- RSI mean-reversion family: ONE module, pluggable confirmation filters
  #     (playbook skill 27/32 note: 6 variants = 1 build + 1 comparison test) --
  rsi_reversion:
    skill: [25, 27, 28, 32]
    tier: swing
    priority: 3                      # each filter has an unresolved ambiguity —
    enabled: false                   # settle from card text before building
    params:
      rsi_period: 14
      confirmation_filter: none      # slow_rsi (25) | volume_osc (27) |
                                     # divergence (28) | mw_pattern (32)
      regime_gate: range_only
      time_stop_bars: 20
      # skill 25: resolve slow-RSI reading A vs B; skill 27: resolve VO direction;
      # skill 28: confirmed-pivot divergence only (no repaint); skill 32: use
      # neckline-break trigger, location filter W<40 / M>60.

  # --- Priority 3: provisional -----------------------------------------------
  bb_fake_move:
    skill: 9
    tier: swing
    priority: 3
    enabled: false                   # card rule garbled — reconstruct + validate
    params:
      interpretation: no_close_beyond_band   # "fake" = band tagged but held
      trend_intact: mid_band_rising
      fold_into: vwap_rsi_pullback   # if no distinct edge in backtest

  sector_confirmation:
    skill: 11
    tier: gate                       # filter, not a strategy
    priority: 3
    enabled: false
    params:
      cheap_test_first: "ES longs only when NQ above its VWAP/EMA"

  sar_rsi_scalp:
    skill: 31
    tier: scalp
    priority: 3
    enabled: false                   # = skill 12 with SAR swapped in; A/B variant only
    params:
      timeframe_minutes: 3
      min_stop_atr: 0.75             # SAR stops can be tighter than noise
      heiken_ashi: display_only      # NEVER fill at HA prices

  trendline_retest:
    skill: 30
    tier: swing
    priority: 3
    enabled: false                   # diagonal-level provider for pivot_levels retest
    params:
      level_source: regression_channel   # reproducible; not hand-drawn trendlines
      regression_bars: 50

  # --- Excluded from automation (kept for the record) ------------------------
  # skill 14 (Gann fan)      — arbitrary scaling, not reproducible; use
  #                            regression channel (trendline_retest) instead
  # skill 18 (Renko)         — synthetic fills inflate backtests; low priority
  # skill 20 (Elliott)       — non-unique revisable counts = repainting; the
  #                            tradable part IS two_legged_pullback
  # skill 5 martingale ladder — signal kept in ema_snapback_scalp, sizing discarded

# ----------------------------------------------------------------------------
# Risk — configured PER PRODUCT, not here.
#
# Every product in products.yaml carries its own required `risk:` block
# (max_contracts, risk_per_trade_pct, stop_loss_usd, risk_reward_ratio,
# trail_step_pct, daily_loss_limit_usd) so clients control risk values per
# product. Partial exits are strategy-level (params blocks below), not
# product-risk keys. There is
# deliberately no generic fallback: a product without a risk block fails
# config validation at startup rather than inheriting someone else's numbers.
#
# Only operational safety switches (not risk appetite) live globally:
# ----------------------------------------------------------------------------
risk_operations:
  flatten_on_disconnect: true
  max_concurrent_strategies_per_product: 1   # regime router picks one module

# ----------------------------------------------------------------------------
# Monitoring
# ----------------------------------------------------------------------------
monitoring:
  metrics_base_port: 8100            # product N gets 8100 + N
  log_level: INFO
  log_dir: logs
