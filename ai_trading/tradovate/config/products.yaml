# ============================================================================
# CME Mini & Micro Futures Product Catalog
# ============================================================================
# Source: CME Group product slate (Minis & Micros, all asset classes)
# https://www.cmegroup.com/markets/products (groups=Minis/Micros)
#
# Per-product fields:
#   trade:        true  = the bot will trade this product (when enabled by mode)
#                 false = catalog entry only — ignored by the launcher
#   exchange:     CME / CBOT / NYMEX / COMEX  (all route through CME Globex)
#   size:         contract unit (what one contract represents)
#   tick_size:    minimum price increment
#   tick_value:   dollar value of one tick — used by risk.py to convert
#                 STOP_LOSS_USD into ticks
#   months:       listed contract cycle (resolver picks the ACTIVE month daily
#                 from CME Volume & Open Interest — see contract_resolver)
#   cme_slug:     path fragment for the CME product page; the Volume & OI page
#                 is https://www.cmegroup.com/markets/<cme_slug>/volume
#   risk:         REQUIRED per-product risk settings — risk is controlled at
#                 product level (no global fallback in config.yaml), so a
#                 client tunes each product independently:
#                   max_contracts          max absolute net position
#                   risk_per_trade_pct     % of account risked per R
#                   stop_loss_usd          hard dollar cap per position
#                   risk_reward_ratio      fallback TP when no ladder applies
#                   partial_exit_ladder    t1_rr/t1_fraction/t2_rr partial exits
#                   breakeven_after_t1     move stop to entry after T1 fills
#                   trail_step_pct         trail step as fraction of TP range
#                   daily_loss_limit_usd   product stops entering for the day
#   overrides:    optional per-product strategy overrides (same keys as the
#                 strategies.<module>.params blocks in config.yaml)
# ============================================================================

products:

