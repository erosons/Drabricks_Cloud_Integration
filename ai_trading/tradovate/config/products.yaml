    name: Micro E-mini S&P 500
    category: equities
    exchange: CME
    class: micro
    size: "$5 x S&P 500 Index"
    tick_size: 0.25
    tick_value: 1.25
    months: [H, M, U, Z]                # quarterly: Mar, Jun, Sep, Dec
    cme_slug: equities/sp/micro-e-mini-sandp-500
    risk:
      max_contracts: 1
      risk_per_trade_pct: 0.5
      stop_loss_usd: 50.0
      risk_reward_ratio: 3.0
      partial_exit_ladder: { t1_rr: 2.0, t1_fraction: 0.5, t2_rr: 4.0 }
