module: ema_sr_break
skills: [3]
archetype: level-break (trend-filtered)
tier: scalp
priority: 1
status_requested: idea

goal:
  edge_hypothesis: >
    9/21 EMA alignment defines trend bias; horizontal level breaks taken ONLY
    in the EMA-agreed direction filter out counter-trend breakouts. Session
    extremes (prior-day H/L, overnight H/L) supply the levels — that's where
    real stops and liquidity sit, unlike rolling N-bar extremes.
  markets: [MES, MNQ]
  timeframe: intraday
  session: rth
  target_ret_dd: 2.0
  expected_frequency: 1-3 per session

mechanics:
  bias: EMA9 vs EMA21 with min_ema_separation_atr (0.25) — alignment must mean
        a real trend, not a coin flip
  entry: close beyond the session level (break_confirmation close — never wick)
  stop: below/above the broken structure or recent swing
  targets: 1:2 / 1:4 ladder, or trail
  exit: trail_alt ema21_close_back (close back through EMA21)
  regime_gate: the EMA filter is the gate; also reusable as a shared regime
               input for other modules
  shared_services: [levels_service.session_extremes, regime_classifier]

prerequisites: []

risks_and_guards:
  - EMA pair whipsaws badly on low timeframes in chop — the separation floor
    is mandatory, not cosmetic.
  - Card specified no stop/target; the defaults above are locked before any
    backtest so results are reproducible.

ambiguities_open: []
ambiguities_resolved:
  - "Level source resolved to session extremes over rolling N-bar highs
     (playbook skill-3 assessment)."
