# ============================================================================
# SECTION 4: PUBLICATION REQUIREMENTS
# ============================================================================
# Validation rules that must pass before a data product is published.

publication_requirements:
  mandatory_table_tags:
  require_grants_defined: true
  require_policy_binding_at_any_level: true
