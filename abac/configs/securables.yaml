  #       privileges: [USE SCHEMA]
  #   data_product:
  #     product_id: hr_core
  #     product_owner: hr-data-product-owner
  #     steward: hr-governance-steward
  #     domain: hr

# ============================================================================
# SECTION 3: TABLE DEFINITIONS
# ============================================================================
# Tables define individual data products. Each table specifies:
#   - Column definitions with governed tags
#   - Base RBAC grants only (SELECT, MODIFY, etc.)
#   - Table-level policy_bindings for targeted enforcement
#
# NOTE: Groups and their allowed/exception roles are NOT defined here.
# They belong in policies.yaml under each policy's TO/EXCEPT clauses.
# This file only grants privileges to groups that already exist.

tables:
  # ---------------------------------------------------------------------------
  # TABLE 1: customer_profile
  # Policies bound: active_records_only (table-level), ssn_full_redaction (table-level)
  # Also inherits: regional_data_isolation, pii_phone_masking (from schema)
  #                pii_email_masking (from catalog)
  # ---------------------------------------------------------------------------
  - table_id: customer_profile
    catalog: general_use
    schema: customer
    description: "Core customer profile with PII fields"
    policy_bindings:
      - active_records_only     # table-level: hide soft-deleted rows
      - ssn_full_redaction      # table-level: fully redact SSN column
    # grants:
    #   - group: customer_data_editors
    #   - group: customer_cleartext_approved
    columns:
      - name: customer_id
        type: BIGINT
        tags: {}
      - name: first_name
        type: STRING
        tags:
          class.name: ""
      - name: last_name
        type: STRING
        tags:
          class.name: ""
      - name: email
        type: STRING
        tags:
          class.email_address: ""
      - name: phone_number
        type: STRING
        tags:
          class.phone_number: ""
      - name: date_of_birth
        type: DATE
        tags:
          class.date_of_birth: ""
      - name: ssn
        type: STRING
        tags:
          class.us_ssn: ""
      - name: region_code
        type: STRING
        tags:
          region_identifier: ""
      - name: is_active
        type: BOOLEAN
        tags:
          soft_delete_flag: ""
      - name: created_at
        type: TIMESTAMP
        tags: {}

  # ---------------------------------------------------------------------------
  # TABLE 2: customer_addresses
  # Policies bound: none at table-level
  # Inherits: regional_data_isolation, pii_phone_masking (from schema)
