# ============================================================================
# UC DATA SECURABLES CONFIGURATION
# ============================================================================
# This file defines the Unity Catalog DATA TARGETS only:
#   - Catalogs, schemas, tables, and columns
#   - Governed tag assignments per object
#   - Policy bindings (which policies from policies.yaml apply here)
#   - Base RBAC grants (privileges on objects)
#
# This file does NOT define:
#   - Policy logic, UDFs, or group templates (-> policies.yaml)
#   - Allowed/exception groups for policies (-> policies.yaml TO/EXCEPT)
#   - Group creation (-> policies.yaml group_templates)
#
# The reconciliation engine reads BOTH files:
#   securables.yaml -> What objects exist, how they're tagged, who gets RBAC
#   policies.yaml   -> What rules enforce, who is allowed/excepted per policy
# ============================================================================

api_version: governance.databricks.com/v1
kind: SecurableRegistry
metadata:
  registry_id: enterprise_data_products
  version: 1.0.0
  status: approved
  owner: data-platform-team
  last_reviewed: "2024-01-15"

# ============================================================================
# SECTION 1: CATALOG DEFINITIONS
# ============================================================================
# Catalogs are the top-level boundary. Tags applied here set defaults
# that ABAC policies can match against for all child objects.
# policy_bindings reference policy_ids from policies.yaml that should be
# applied ON this catalog (catalog-level scope).

catalogs:
  - catalog_id: general_use
    description: "Primary production catalog for business data products"
    policy_bindings:
      - pii_email_masking   # catalog-level: masks all class.email_address columns
    grants:
      - group: platform_governance_admin
        privileges: [USE CATALOG, MANAGE]
      - group: data_engineering_team
        privileges: [USE CATALOG, CREATE SCHEMA]

# ============================================================================
# SECTION 2: SCHEMA DEFINITIONS
# ============================================================================
# Schemas define domain boundaries. Each schema can bind additional policies
# that inherit to all tables within the schema.
# policy_bindings reference policy_ids applied ON this schema (schema-level scope).

schemas:
  - schema_id: customer
    catalog: general_use
    description: "Customer domain data products"
    policy_bindings:
      - regional_data_isolation   # schema-level: filters rows by region
      - pii_phone_masking         # schema-level: masks class.phone_number columns
    # data_product:
    #   product_id: customer_360
    #   product_owner: customer-data-product-owner
    #   steward: customer-governance-steward
    #   domain: customer

  # - schema_id: hr
